<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Script Marker{% endblock %}</title>
<style>
:root{--red:#B4141E;--ink:#1f2328;--mut:#667085;--line:#e3e5e8;--bg:#f6f7f9;--card:#fff;--ok:#18794e;--warn:#b45309}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--red);color:#fff;padding:12px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header a{color:#fff;text-decoration:none;opacity:.92}header a:hover{opacity:1;text-decoration:underline}
header .brand{font-weight:700;font-size:17px;margin-right:auto}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.step{display:inline-block;background:var(--red);color:#fff;border-radius:50%;width:24px;height:24px;text-align:center;line-height:24px;font-size:13px;font-weight:700;margin-right:6px}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{width:100%;padding:8px 10px;border:1px solid #c9ccd1;border-radius:7px;font:inherit;background:#fff}
textarea{min-height:110px;font-size:13.5px}
button,.btn{display:inline-block;background:var(--red);color:#fff;border:0;border-radius:7px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
button.sec,.btn.sec{background:#fff;color:var(--ink);border:1px solid #c9ccd1}button.small,.btn.small{padding:4px 9px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
table{border-collapse:collapse;width:100%}th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}td.n,th.n{text-align:center}
.scroll{overflow-x:auto}.mut{color:var(--mut)}.small{font-size:13px}
.msg{background:#fff7e6;border:1px solid #f1d59a;border-radius:8px;padding:10px 14px;margin-bottom:14px}
.pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12.5px;font-weight:600;background:#eceef1}
.pill.done{background:#dff3e8;color:var(--ok)}.pill.error{background:#fde4e4;color:#a11}.pill.busy{background:#e4edff;color:#1d4ed8}
.flag{color:var(--warn);font-size:13px}tr.flagged{background:#fffaf0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:10px;background:#e7e9ec;border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--red)}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}.pages img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
details summary{cursor:pointer;font-weight:600}
</style></head><body>
<header><span class="brand">Script Marker</span>
{% if u %}<a href="/">Tests</a>{% if u.role=='admin' %}<a href="/admin">Users &amp; settings</a>{% endif %}
<span class="small">{{u.name}} · {{ROLE_LABEL[u.role]}}</span><a href="/logout">Log out</a>{% endif %}</header>
<main>{% if msg %}<div class="msg">{{msg}}</div>{% endif %}{% block body %}{% endblock %}</main></body></html>
